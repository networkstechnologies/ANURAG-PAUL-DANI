name: account_keeping_mobile
description: Account Keeping — GST accounting on the go (owner / accountant app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2   # persist token + selected company
  intl: ^0.19.0                # currency / dates
  share_plus: ^7.2.2           # share an invoice

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
