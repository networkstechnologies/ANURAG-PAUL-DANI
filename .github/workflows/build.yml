name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate Android platform files
        run: flutter create --org com.akjava --project-name account_keeping_mobile --platforms=android .

      - name: Force compileSdk 36 on all modules via Gradle init script
        run: |
          mkdir -p "$HOME/.gradle"
          echo 'allprojects { afterEvaluate { p -> if (p.hasProperty("android")) { p.android.compileSdkVersion 36 } } }' > "$HOME/.gradle/init.gradle"
          echo "init.gradle contents:"; cat "$HOME/.gradle/init.gradle"

      - name: Guarantee INTERNET permission and app label
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MAN" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MAN"
          sed -i 's#android:label="[^"]*"#android:label="AccountKeeping"#' "$MAN"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccountKeeping-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
